# FR-FCM-ZZPH / Weber & Robinson 2016 cytometry clustering suite.
# Stage numeric matrices under $FLOW_CLUSTERING_BENCH_DATA; never commit raw data.
#
# Reference wall times are from published tables (different language/hardware).
# Weber & Robinson 2016 Table 3 FlowSOM runtimes; Stassen et al. 2020 reports
# PARC scalability on Samusik_all subsamples (Fig. 3) rather than one scalar per
# dataset — parc_ref_secs is omitted unless a clear published scalar exists.

paper_hardware_weber = "See Weber & Robinson 2016 Supporting Information Tables S1/S4 (multi-core; not single-machine identical)."
paper_hardware_stassen = "8× 3.6 GHz CPUs, 126 GB RAM (Stassen et al. 2020)."
flowrepository_id = "FR-FCM-ZZPH"

