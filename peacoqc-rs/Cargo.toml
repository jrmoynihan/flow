[package]
name="peacoqc-rs"
version= "0.3.1"
edition.workspace=true
authors.workspace=true
license.workspace=true
description="PeacoQC quality control algorithms for flow cytometry"
repository="https://github.com/jrmoynihan/flow/peacoqc-rs"
keywords=[
    "flow-cytometry",
    "quality-control",
    "bioinformatics",
    "peacoqc",
]
categories=["science", "algorithms"]

[features]
default =["flow-fcs", "gpu", "plots"]
flow-fcs=["dep:flow-fcs", "dep:polars"]
gpu = ["dep:burn"]
cubecl = ["dep:cubecl", "dep:bytemuck", "gpu"]
# QC plot rendering (src/qc/plots.rs). Pulls in plotters, which on Linux
# requires the system fontconfig library -- kept optional so consumers that
# only need the QC algorithms (e.g. peacoqc-py) can skip that dependency.
plots = ["dep:plotters", "dep:image"]

[dependencies]
flow-fcs = { path = "../fcs", version = "^0.5.0", optional=true, features=["test-util"] }
polars              ={ workspace=true, optional=true }
anyhow.workspace    =true
thiserror.workspace =true
rand.workspace      =true
rayon.workspace     =true
plotters = { workspace = true, optional = true }
image = { workspace = true, optional = true }
serde.workspace     =true
serde_json.workspace=true
tracing.workspace   =true
derive_builder      ={ workspace = true } # Builder pattern for config structs
realfft             ="3.5.0" # FFT-based KDE for performance
faer                ={ workspace = true } # Cholesky for R-compatible smooth.spline
burn                ={ workspace = true, optional = true }
cubecl              ={ workspace = true, optional = true }
bytemuck            ={ workspace = true, optional = true }

[dev-dependencies]
approx = { workspace = true }
criterion = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name   ="peacoqc_bench"
harness=false

[[bench]]
name   ="kde_bench"
harness=false

[[bench]]
name   ="qc_throughput"
harness=false

[[bench]]
name   ="gpu_bench"
harness=false

[[bench]]
name   ="peaks_alloc_micro"
harness=false

[package.metadata.scripts]
test       ="cargo test"
dry-release="cargo smart-release peacoqc-rs --update-crates-index"
publish    ="cargo smart-release peacoqc-rs --update-crates-index --execute"
changelog  ="cargo changelog peacoqc-rs --write"
