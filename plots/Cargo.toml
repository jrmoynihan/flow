[package]
name="flow-plots"
version= "0.3.3"
edition.workspace=true
authors.workspace=true
repository="https://github.com/jrmoynihan/flow/plots"
license="MIT"
description="Package for drawing and interacting with plots in flow cytometry data"
keywords=[
    "flow-cytometry",
    "bioinformatics",
    "science",
    "visualization",
    "plots",
]
categories=["science", "visualization"]

[features]
# Current default is plotters.  Use "raster" feature for Kuva backend for density (linear axes, original-value ticks). Enable by default to encourage use.
default=[]
# Expose kuva rendering APIs (render_to_rgba, render_to_png_raster) for Tauri/zero-copy display
raster=["dep:kuva"]

[dependencies]
colormap      ="0.0.2"
colorgrad     ={ version="0.8", features=["preset"] }
derive_builder={ workspace=true }
flow-fcs = { path = "../fcs", version = "^0.5.2" }
flow-density  = { path = "../flow-density", version = "^0.1.2" }
image         ={ workspace=true }
plotters      ={ workspace=true }
anyhow        ={ workspace=true }
rustc-hash    ={ workspace=true }
serde         ={ workspace=true, features=["derive"] }
ts-rs         ={ workspace=true }
once_cell     ="1.20"
rayon         ={ workspace=true }
num-traits    ="0.2"
ndarray       ={ workspace=true }
# Optional for raster feature (render_to_rgba, render_to_png_direct).
# crates.io requires a version; git is used locally and stripped on publish.
# TODO: Align with upstream kuva once arch optimizations land on crates.io.
kuva={ version="0.1.3", git="https://github.com/jrmoynihan/kuva", optional=true, features=[
    "png",
] }

[dev-dependencies]
criterion={ workspace=true }
rand     ={ workspace=true }

[[example]]
name="plot_types_validation"
path="examples/plot_types_validation.rs"

[[example]]
name="density_arcsinh_kuva"
path="examples/density_arcsinh_kuva.rs"
required-features=["raster"]

[[example]]
name="density_arcsinh_kuva_styled"
path="examples/density_arcsinh_kuva_styled.rs"
required-features=["raster"]

[[bench]]
name   ="batch_density"
harness=false

[package.metadata.scripts]
test       ="cargo nextest run"
dry-release="cargo smart-release flow-plots --update-crates-index"
publish    ="cargo smart-release flow-plots --update-crates-index --execute"
changelog  ="cargo changelog flow-plots --write"
