[package]
name="flow-tru-ols"
version="0.1.0"
edition.workspace=true
authors.workspace=true
repository="https://github.com/jrmoynihan/flow/tru-ols"
license="MIT"
description="TRU-OLS (Truncated ReUnmixing OLS) algorithm for flow cytometry unmixing"
keywords=[
    "flow",
    "cytometry",
    "unmixing",
    "bioinformatics",
    "science",
]
categories=["science", "algorithms"]

[features]
default =["flow-fcs"]
flow-fcs=["dep:flow-fcs", "dep:polars"]
plotting=["dep:flow-plots", "flow-fcs"]
# Opt-in system BLAS (OpenBLAS) for linear algebra; default uses pure-Rust faer
blas=["dep:ndarray-linalg", "dep:ndarray"]
# cubeCL + WGPU for optional GPU GEMM (RHS block of normal-equations OLS)
cubecl=["dep:cubecl", "dep:bytemuck"]
# More than 128 endmembers (bitmask bookkeeping uses heap-backed structures)
large-panels=[]
# Bounded concurrent cache of Gram Cholesky factors keyed by active-endmember mask
unmix-cache=["dep:quick_cache"]

[dependencies]
flow-fcs = { path = "../fcs", version = "^0.5.1", optional=true }
flow-linalg = { path = "../flow-linalg", version = "^0.1.2" }
# Plotters backend until kuva stabilizes (omit default "raster" feature)
flow-plots={ path="../plots", version= "^0.3.2", optional=true, default-features=false }
polars={ workspace=true, optional=true }
faer={ workspace=true }
faer-ext={ workspace=true }
# Pin 0.17 to match ndarray-linalg 0.18 (workspace ndarray is 0.16 for polars/faer-ext elsewhere).
ndarray={ version="0.17.1", optional=true, default-features=false, features=[
    "std",
] }
ndarray-linalg={ version="0.18.1", optional=true, features=[
    "openblas-system",
] }
rayon={ workspace=true }
anyhow={ workspace=true }
thiserror={ workspace=true }
serde={ workspace=true, features=["derive"] }
serde_json={ workspace=true }
rand={ workspace=true }
cubecl={ workspace=true, optional=true }
bytemuck={ workspace=true, optional=true }
quick_cache={ version="0.6", optional=true, features=["stats"] }

[dev-dependencies]
flow-fcs = { path = "../fcs", features = ["test-util"] }
criterion={ workspace=true }

[[bench]]
name = "unmixing_benchmark"
harness = false

[[bench]]
name = "ols_method_compare"
harness = false
required-features = ["cubecl"]

[package.metadata.scripts]
test       ="cargo test"
dry-release="cargo smart-release flow-tru-ols --update-crates-index"
publish    ="cargo smart-release flow-tru-ols --update-crates-index --execute"
changelog  ="cargo changelog flow-tru-ols --write"
