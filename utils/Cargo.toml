[package]
name="flow-utils"
version= "0.1.1"
edition.workspace=true
authors.workspace=true
license.workspace=true
description="Shared algorithms and utilities for flow cytometry crates"
repository="https://github.com/jrmoynihan/flow/utils"
keywords=[
    "flow-cytometry",
    "algorithms",
    "kde",
    "clustering",
    "pca",
]
categories=["science", "algorithms"]

[features]
default=[]
gpu    =["dep:burn", "dep:cubecl", "dep:bytemuck"]

[dependencies]
# Array operations (ndarray 0.16 for linfa compatibility)
ndarray={ workspace=true }
# Use linfa-linalg for SVD (compatible with ndarray 0.16)
linfa-linalg="0.2"

# FFT for KDE
realfft="3.5.0"

# Clustering
linfa-clustering="0.8"
linfa           ="0.8"

# Error handling
thiserror={ workspace=true }
anyhow   ={ workspace=true }

# Parallelization
rayon={ workspace=true }

# GPU support (optional)
burn    ={ workspace=true, optional=true }
cubecl  ={ workspace=true, optional=true }
bytemuck={ workspace=true, optional=true }

[dev-dependencies]
approx = { workspace = true }
criterion = { workspace = true }
