[workspace]
members = [
    "fcs",
    "flow-fcs-compress",
    "flow-fcs-bench",
    "flow-linalg",
    "flow-density",
    "flow-clustering",
    "flow-knn",
    "flow-dimensional-reduction",
    "flow-pacmap",
    "plots",
    "gates",
    "peacoqc-rs",
    "peacoqc-cli",

    "tru-ols",
    "tru-ols-cli",
    "flow-peak-detection",
    "flow-control-detection",

]
resolver = "3"

[workspace.package]
edition = "2024"
authors = ["James Moynihan"]
license = "MIT"

[workspace.metadata.scripts]
build = "cargo build --workspace"
test = "cargo nextest run --workspace"
run = "cargo run --workspace"
check = "cargo check --workspace"
clippy = "cargo clippy --workspace"
fmt = "cargo fmt --workspace"
publish-workspace = "cargo publish --workspace"

[workspace.dependencies]
# Calendar arithmetic for the FCS 3.2 datetime keywords. Already in the graph
# via polars, so this costs nothing to compile.
#
# `now` (not `clock`) is what our code actually needs: `Utc::now()` without
# `Local`, whose `localtime_r` call is the subject of RUSTSEC-2020-0159. Note
# that this is a floor, not a ceiling - cargo unions features across the graph,
# and polars enables `clock`, so `iana-time-zone` is compiled regardless of what
# we declare here. The declaration keeps us off that path on our own account if
# polars ever drops chrono; staying off `Local` in the source is what actually
# holds today. Nothing here needs a local timezone - FCS timestamps are either
# zoneless or carry an explicit offset.
chrono = { version = "0.4", default-features = false, features = ["std", "now"] }
# Polars for columnar data storage
# Note: Using default-features = false to reduce bloat, but keeping dtype-full as it's needed
polars = { version = "0.54.4", default-features = false, features = [
    "lazy",
    "ndarray",
    "dtype-full",
    "ipc",
    "ipc_streaming",
    "parquet",
    "strings",
    "temporal"
] }
# Matrix manipulation (ndarray 0.16 for linfa/faer-ext compatibility)
ndarray = { version = "0.16.1", features = [
    "matrixmultiply-threading",
    "rayon",
    "serde",
] }
# Pure-Rust linear algebra (replaces ndarray-linalg; no system BLAS required)
faer = { version = "0.24", features = ["rayon"] }
faer-ext = { version = "0.7", features = ["ndarray"] }

# Parallelization
rayon = "1.11"

# Error Handling
thiserror = "2.0.19"
anyhow = "1.0.102"

# Serialization
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.149"

# Performance
uuid = { version = "1.18.1", features = ["v4"] } # For generating UUIDs/GUIDs
memchr = "2.7.6" # SIMD-accelerated string searching in metadata parsing
rustc-hash = "2.1" # A speedy, non-cryptographic hashing algorithm used by rustc
memmap3 = "0.1"  # For memory-mapping large files (safe, zero-unsafe replacement for memmap2) 

# DX improvement
itertools = "0.15" # For iterating over collections
derive_builder = "0.20" # For building structs with builder pattern
byteorder = "1.5" # For dealing with endianness of data
bytecount = "0.6.4" # For counting bytes in a slice of bytes
strum = "0.28.0" # For enum-like types
strum_macros = "0.28.0" # For enum-like types
regex = "1.11.3" # For regular expressions
bytemuck = { version = "1.24", features = ["derive"] } # Bytemuck for zero-copy bit-cast conversions between types
rand = "0.10.2"
rand_distr = "0.6.0"
ts-rs = "12.0.1"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }

# CLI (indicatif used in peacoqc-cli, tru-ols-cli)
clap = { version = "4.5.60", features = ["derive", "cargo"] }
indicatif = "0.18.3"

# Logging/Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Visualization (plotters, image used in plots, peacoqc-rs, tru-ols-cli)
plotters = "0.3.7"
image = "0.25.10"

# CSV (tru-ols-cli)
csv = "1.3"

# Benchmarks, tests
criterion = { version = "0.8.1", features = ["html_reports"] }
approx = "0.5.1"
tempfile = "3.26"
loom = "12.0.1" # For multithreaded testing

# Compression (flow-fcs-compress)
fastlanes = "0.6"
zstd = "0.13"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
pco = "1.0.2"
lz4_flex = { version = "0.13", default-features = false, features = ["frame"] }

# GPU (Burn 0.21 ↔ cubeCL 0.10; keep in lockstep across peacoqc / pacmap / tru-ols / density)
burn = { version = "0.21", default-features = false, features = ["std", "wgpu"] }
cubecl = { version = "0.10", default-features = false, features = ["std", "wgpu"] }

# Some crates.io packages ship a `.vscode/` tree; creating that directory is blocked in
# Cursor agent sandboxes. Path-patch those packages so `cargo` never unpacks them.
[patch.crates-io]
pastey = { path = "third_party/pastey" }
bit-vec = { path = "third_party/bit-vec" }
