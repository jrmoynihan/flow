[package]
name="flow-gates"
version= "0.5.0"
edition.workspace=true
authors.workspace=true
repository="https://github.com/jrmoynihan/flow/gates"
license="MIT"
description="Package for drawing and interacting with gates in flow cytometry data"
keywords=[
    "flow",
    "cytometry",
    "bioinformatics",
    "science",
    "gates",
]
categories=["science", "visualization"]

[dependencies]
flow-fcs = { path = "../fcs", version = "^0.5.1" }
# Plotters backend for density; omit default "raster" so dependents (e.g. tru-ols-cli) get plotters
flow-plots          ={ path="../plots", version= "^0.3.2", default-features=false }
flow-density    = { path = "../flow-density",    version = "^0.1.1" }
flow-clustering = { path = "../flow-clustering", version = "^0.1.1" }
anyhow.workspace    =true
thiserror.workspace =true
serde.workspace     =true
serde_json.workspace=true
geo                 ="0.33"
rstar               ="0.12"
quick-xml           ={ version="0.39", features=["serialize"] }
rayon               ={ workspace=true }
once_cell           ="1.20"
bytemuck            ={ workspace=true }
ndarray              ={ workspace = true }
# Optional: TypeScript binding generation (mirrors flow-fcs's `typescript` feature).
# Enabled only when generating bindings; off for normal builds + crates.io consumers.
ts-rs               ={ workspace=true, optional=true }
specta              ={ workspace=true, optional=true }

[features]
default=[]
# Derive ts_rs::TS on the public gate types so the app can generate TS bindings
# (run via a gated test). See tests/export_bindings.rs.
typescript=["dep:ts-rs"]
specta=["dep:specta"]

[dev-dependencies]
flow-fcs = { path = "../fcs", features = ["test-util"] }
criterion = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }
polars = { workspace = true }

[[example]]
name = "visualize_synthetic_data"
path = "examples/visualize_synthetic_data.rs"
required-features = []

[package.metadata.scripts]
test-compliance     ="cargo nextest run --test compliance_tests --run-ignored=only"
test-compliance-list="cargo nextest list --test compliance_tests"
test-all            ="cargo nextest run --all-features"
test-unit           ="cargo nextest run --lib"
test-integration    ="cargo nextest run --tests"
dry-release         ="cargo smart-release flow-gates --update-crates-index"
publish             ="cargo smart-release flow-gates --update-crates-index --execute"
changelog           ="cargo changelog flow-gates --write"
