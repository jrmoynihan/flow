[package]
name="flow-gates"
version= "0.3.0"
edition.workspace=true
authors.workspace=true
repository="https://github.com/jrmoynihan/flow/gates"
license="MIT"
description="Package for drawing and interacting with gates in flow cytometry data"
keywords=[
    "flow",
    "cytometry",
    "bioinformatics",
    "science",
    "gates",
]
categories=["science", "visualization"]

[dependencies]
flow-fcs            ={ path="../fcs", version= "^0.3.0" }
# Plotters backend for density; omit default "raster" so dependents (e.g. tru-ols-cli) get plotters
flow-plots          ={ path="../plots", version= "^0.3.1", default-features=false }
flow-utils           ={ path="../utils", version= "^0.1.1" }
anyhow.workspace    =true
thiserror.workspace =true
serde.workspace     =true
serde_json.workspace=true
geo                 ="0.32"
rstar               ="0.12"
quick-xml           ={ version="0.39", features=["serialize"] }
rayon               ={ workspace=true }
once_cell           ="1.20"
bytemuck            ={ workspace=true }
ndarray              ={ workspace = true }

[features]
default=[]

[dev-dependencies]
criterion = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }
polars = { workspace = true }

[[example]]
name = "visualize_synthetic_data"
path = "examples/visualize_synthetic_data.rs"
required-features = []

[package.metadata.scripts]
test-compliance     ="cargo test --test compliance_tests -- --ignored"
test-compliance-list="cargo test --test compliance_tests -- --list"
test-all            ="cargo test --all-features"
test-unit           ="cargo test --lib"
test-integration    ="cargo test --test '*'"
dry-release         ="cargo smart-release flow-gates --update-crates-index"
publish             ="cargo smart-release flow-gates --update-crates-index --execute"
changelog           ="cargo changelog flow-gates --write"
