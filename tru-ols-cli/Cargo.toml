[package]
name="tru-ols"
version= "0.2.0"
edition.workspace=true
authors.workspace=true
repository="https://github.com/jrmoynihan/flow/tru-ols-cli"
license="MIT"
description="Command-line tool for TRU-OLS flow cytometry unmixing"
keywords=[
    "flow-cytometry",
    "unmixing",
    "compensation",
    "bioinformatics",
    "command-line",
]
categories=["science", "command-line-utilities"]

[[bin]]
name="tru-ols"
path="src/main.rs"

[features]
# `cli_benchmark`: synthetic OLS vs TRU-OLS reports (`src/benchmark.rs`); requires full `flow-tru-ols` APIs.
# Disable default features when building against an older `flow-tru-ols` snapshot (e.g. `git stash` of perf work).
default = ["cli_benchmark"]
cli_benchmark = []
# Build `examples/e2e_plate_throughput` against pre-optimization `flow-tru-ols` (`git stash` plan changes).
e2e_legacy = []
blas = ["flow-tru-ols/blas"]

[[example]]
name="generate_synthetic_test_data"
path="examples/generate_synthetic_test_data.rs"

[dependencies]
flow-fcs = { path = "../fcs", version = "^0.5.2", features = ["test-util"] }
flow-tru-ols={ path="../tru-ols", version="^0.2.0", features=[
    "flow-fcs",
    "plotting",
    "unmix-cache",
] }
# Plotters backend until kuva stabilizes (omit default "raster" feature)
flow-plots={ path="../plots", version="^0.3.3", default-features=false }
flow-density={ path="../flow-density", version= "^0.1.2" }
flow-clustering={ path="../flow-clustering", version= "^0.1.2" }
flow-gates={ path="../gates", version="^0.5.0" }
peacoqc-rs={ path="../peacoqc-rs", version= "^0.3.3", features=[
    "flow-fcs",
] }
polars={ workspace=true }
anyhow={ workspace=true }
serde={ workspace=true, features=["derive"] }
serde_json={ workspace=true }
clap={ workspace=true }
indicatif={ workspace=true }
rayon={ workspace=true }
tracing={ workspace=true }
tracing-subscriber={ workspace=true }
ndarray={ workspace=true }
faer={ workspace=true }
faer-ext={ workspace=true }
csv={ workspace=true }
rand={ workspace=true }
rand_distr={ workspace=true }
plotters={ workspace=true }
image={ workspace=true }
inquire="0.9"
shellexpand="3.1.2"

[package.metadata.scripts]
test       ="cargo nextest run"
dry-release="cargo smart-release tru-ols --update-crates-index --no-dependencies"
publish    ="cargo smart-release tru-ols --update-crates-index --no-dependencies --execute"
changelog  ="cargo changelog tru-ols --write"
