[package]
name = "flow-autospectral"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license = "MIT"
repository = "https://github.com/jrmoynihan/flow/flow-autospectral"
readme = "README.md"
description = "Multi-AF spectral library discovery and per-event matching for flow cytometry unmixing"
keywords = ["flow-cytometry", "unmixing", "autofluorescence", "spectral", "autospectral"]
categories = ["science", "algorithms"]

[features]
default = ["hnsw"]
hnsw = ["flow-knn/hnsw"]
ann-search = ["flow-knn/ann-search"]
gpu = ["ann-search", "flow-knn/gpu"]
tru-ols = ["dep:flow-tru-ols"]
fcs = ["dep:flow-fcs", "flow-fcs/synthetic", "flow-tru-ols?/flow-fcs"]

[dependencies]
faer = { workspace = true }
ndarray = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }
flow-clustering = { path = "../flow-clustering", version = "^0.2.0" }
flow-dimensional-reduction = { path = "../flow-dimensional-reduction", version = "^0.1.0" }
flow-knn = { path = "../flow-knn", version = "^0.1.1", default-features = false }
flow-tru-ols = { path = "../tru-ols", version = "^0.2.0", optional = true, default-features = false }
flow-fcs = { path = "../fcs", version = "^0.5.2", optional = true }

[dev-dependencies]
approx = { workspace = true }
criterion = { workspace = true }
rand = { workspace = true }
tempfile = { workspace = true }
flow-fcs = { path = "../fcs", features = ["synthetic"] }

[[bench]]
name = "discover_and_match"
harness = false

[[bench]]
name = "match_matrix"
harness = false

[[bench]]
name = "scatter_clean"
harness = false

[[example]]
name = "af_match_tru_ols"
required-features = ["tru-ols", "fcs"]

[[example]]
name = "method_comparison"
required-features = ["tru-ols"]

[package.metadata.scripts]
dry-release = "cargo smart-release flow-autospectral --update-crates-index"
publish = "cargo smart-release flow-autospectral --update-crates-index --execute"
changelog = "cargo changelog flow-autospectral --write"
