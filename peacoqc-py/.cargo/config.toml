# ring's pregenerated ARMv8 assembly requires the C preprocessor to define
# __ARM_ARCH. The manylinux aarch64 cross-gcc doesn't define this macro from
# -march=armv8-a alone (that flag was tried first and still failed the same
# way), so define it explicitly. Without this, cross-compiling for
# aarch64-unknown-linux-gnu fails building ring (pulled in transitively via
# rustls/reqwest from polars-io's cloud support).
[env]
CFLAGS_aarch64_unknown_linux_gnu = "-D__ARM_ARCH=8"
