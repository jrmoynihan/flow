[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "peacoqc-rs"
dynamic = ["version"]
description = "Python bindings for peacoqc-rs flow cytometry quality control"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "James Moynihan" }]
keywords = ["flow-cytometry", "quality-control", "bioinformatics", "peacoqc"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["polars>=1.0"]

[project.urls]
Repository = "https://github.com/jrmoynihan/flow"
Homepage = "https://github.com/jrmoynihan/flow/tree/main/peacoqc-py"

[tool.maturin]
manifest-path = "Cargo.toml"
python-source = "python"
# PyPI project name is "peacoqc-rs" (see [project] name above), but the
# importable module stays "peacoqc" -- must be explicit once the two diverge.
module-name = "peacoqc"
features = ["pyo3/extension-module"]
